<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구구단 출력 - 2025100561 배선홍 </title>
</head>

<body>
    <h1>구구단 출력</h1>
    <hr>

    <script>
        for (let i = 2; i <= 9; i++) {
            document.write(i + "단<br>");

            let j = 1 ;

            while (j <= 9) {
                document.write(i + " x " + j + " = " + (i * j) + "<br>") ;
                j++;
            }

            document.write("<br>");
        }
    </script>
</body>

</html>
